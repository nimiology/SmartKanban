services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${KANBAN_DB_PASSWORD:?Set KANBAN_DB_PASSWORD in server/.env}
      POSTGRES_DB: kanban
    expose:
      - "5432"
    volumes:
      - kanban_server_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://kanban:${KANBAN_DB_PASSWORD:?Set KANBAN_DB_PASSWORD in server/.env}@db:5432/kanban
      APP_URL: ${APP_URL:-https://kanban.zeydi.site}
      ATTACHMENTS_DIR: /app/server/data/attachments
      PORT: "3001"
    ports:
      - "127.0.0.1:7301:3001"
    volumes:
      - ./server/data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kanban_server_pgdata:
